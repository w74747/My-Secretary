<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>السكرتير التنفيذي الذكي | Personal OS</title>
  
  <!-- إعدادات PWA للهواتف -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4338CA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS & الخطوط -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#F5F6FA] text-[#1E293B] antialiased h-screen overflow-hidden flex flex-col md:flex-row">

  <!-- الشريط الجانبي في شاشات الكمبيوتر (Desktop Sidebar) -->
  <aside class="hidden md:flex w-16 bg-[#4338CA] flex-col items-center py-6 gap-6 text-white/70 select-none z-20 shadow-lg">
    <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow-inner">
      س
    </div>
    <nav class="flex flex-col gap-3 mt-4">
      <button onclick="switchTab('kanban')" id="side-btn-kanban" title="لوحة المهام" class="p-3 rounded-2xl bg-white/20 text-white transition shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      </button>
      <button onclick="switchTab('habits')" id="side-btn-habits" title="العادات والمكافآت" class="p-3 rounded-2xl hover:bg-white/10 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>
      <button onclick="switchTab('agents')" id="side-btn-agents" title="فريق الوكلاء" class="p-3 rounded-2xl hover:bg-white/10 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      </button>
    </nav>
    <div class="mt-auto">
      <button onclick="logoutWhatsApp()" title="تسجيل الخروج من واتساب" class="p-3 rounded-2xl hover:bg-red-500/20 hover:text-red-300 transition text-white/50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- مساحة المحتوى الرئيسية -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    
    <!-- رأس الصفحة العلوي (متجاوب) -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 md:px-8 py-4 flex justify-between items-center z-10">
      <div>
        <h1 class="text-base md:text-xl font-bold text-[#1E293B]">السكرتير التنفيذي الذكي</h1>
        <p class="text-[11px] md:text-xs text-[#64748B] mt-0.5" id="completion-summary">جاري التحميل...</p>
      </div>

      <div class="flex items-center gap-2 md:gap-4">
        <!-- شارة الاتصال -->
        <div id="wa-status-badge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span>جاري الفحص...</span>
        </div>
      </div>
    </header>

    <!-- منطقة عرض التبويبات -->
    <main class="flex-1 overflow-x-auto overflow-y-auto p-4 md:p-8 pb-20 md:pb-8">
      
      <!-- 1. تبويب لوحة الكانبان -->
      <div id="view-kanban" class="flex flex-col md:flex-row gap-6 h-full items-start">
        
        <!-- في الانتظار -->
        <div class="w-full md:w-80 flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-3 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
              <h2 class="font-bold text-xs md:text-sm text-[#1E293B]">في الانتظار</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600" id="count-todo">0</span>
            </div>
          </div>
          <div id="col-todo" class="flex flex-col gap-3.5"></div>
        </div>

        <!-- جاري التنفيذ -->
        <div class="w-full md:w-80 flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-3 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              <h2 class="font-bold text-xs md:text-sm text-[#1E293B]">جاري التنفيذ</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-600" id="count-inprogress">0</span>
            </div>
          </div>
          <div id="col-inprogress" class="flex flex-col gap-3.5"></div>
        </div>

        <!-- المكتملة -->
        <div class="w-full md:w-80 flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-3 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <h2 class="font-bold text-xs md:text-sm text-[#1E293B]">المكتملة</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600" id="count-done">0</span>
            </div>
          </div>
          <div id="col-done" class="flex flex-col gap-3.5"></div>
        </div>

      </div>

      <!-- 2. تبويب العادات والمكافآت -->
      <div id="view-habits" class="hidden flex flex-col gap-6 max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.03)]">
          <h2 class="text-base font-bold text-[#1E293B] mb-2">العادات اليومية ونظام النقاط</h2>
          <p class="text-xs text-[#64748B]">تتبع الورد القرآني، الصلوات، التمارين، والمكافآت المستحقة.</p>
        </div>
      </div>

      <!-- 3. تبويب فريق الوكلاء الذكي -->
      <div id="view-agents" class="hidden flex flex-col gap-6 max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-[0_4px_20px_rgba(0,0,0,0.03)]">
          <h2 class="text-base font-bold text-[#1E293B] mb-2">إدارة فريق الوكلاء الذكي</h2>
          <p class="text-xs text-[#64748B]">تخصيص وكيل البحث، المدير المالي، وسكرتير المواعيد ومفاتيح الربط.</p>
        </div>
      </div>

    </main>

    <!-- شريط التنقل السفلي في شاشات الجوال (Mobile Bottom Nav) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-2.5 px-6 flex justify-around items-center z-20">
      <button onclick="switchTab('kanban')" id="mob-btn-kanban" class="flex flex-col items-center gap-1 text-[#4338CA]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span class="text-[10px] font-semibold">المهام</span>
      </button>
      <button onclick="switchTab('habits')" id="mob-btn-habits" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] font-semibold">العادات</span>
      </button>
      <button onclick="switchTab('agents')" id="mob-btn-agents" class="flex flex-col items-center gap-1 text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span class="text-[10px] font-semibold">الوكلاء</span>
      </button>
    </nav>

  </div>

  <!-- سكريبت التشغيل والتفاعل -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW Error:', err));
    }

    let currentTasks = [];

    function switchTab(tab) {
      ['kanban', 'habits', 'agents'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        const mobBtn = document.getElementById(`mob-btn-${t}`);
        const sideBtn = document.getElementById(`side-btn-${t}`);
        if (mobBtn) mobBtn.className = 'flex flex-col items-center gap-1 text-slate-400';
        if (sideBtn) sideBtn.className = 'p-3 rounded-2xl hover:bg-white/10 hover:text-white transition';
      });

      document.getElementById(`view-${tab}`).classList.remove('hidden');
      const activeMob = document.getElementById(`mob-btn-${tab}`);
      const activeSide = document.getElementById(`side-btn-${tab}`);
      if (activeMob) activeMob.className = 'flex flex-col items-center gap-1 text-[#4338CA]';
      if (activeSide) activeSide.className = 'p-3 rounded-2xl bg-white/20 text-white transition shadow-sm';
    }

    async function checkWhatsAppStatus() {
      try {
        const res = await fetch('/api/whatsapp/status');
        const data = await res.json();
        const badge = document.getElementById('wa-status-badge');
        if (data.isConnected) {
          badge.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold bg-[#DCFCE7] text-[#15803D] border border-emerald-200';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>متصل</span>';
        } else {
          badge.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold bg-[#FFEDD5] text-[#C2410C] border border-amber-200';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span><span>غير متصل</span>';
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        currentTasks = await res.json();
        renderKanban();
      } catch (e) {
        console.error(e);
      }
    }

    function renderKanban() {
      const colTodo = document.getElementById('col-todo');
      const colInProgress = document.getElementById('col-inprogress');
      const colDone = document.getElementById('col-done');

      colTodo.innerHTML = '';
      colInProgress.innerHTML = '';
      colDone.innerHTML = '';

      let countTodo = 0, countProg = 0, countDone = 0;

      currentTasks.forEach(task => {
        const card = createCardElement(task);
        if (task.status === 'DONE' || task.progress === 100) {
          colDone.appendChild(card);
          countDone++;
        } else if (task.status === 'IN_PROGRESS' || task.progress > 0) {
          colInProgress.appendChild(card);
          countProg++;
        } else {
          colTodo.appendChild(card);
          countTodo++;
        }
      });

      document.getElementById('count-todo').textContent = countTodo;
      document.getElementById('count-inprogress').textContent = countProg;
      document.getElementById('count-done').textContent = countDone;

      const total = currentTasks.length;
      const percent = total > 0 ? Math.round((countDone / total) * 100) : 0;
      document.getElementById('completion-summary').textContent = `${percent}% نسبة الإنجاز (${countDone} من ${total})`;
    }

    function createCardElement(task) {
      const card = document.createElement('div');
      card.className = "w-full bg-white p-4.5 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-100 flex flex-col gap-2.5 transition hover:shadow-md";

      let priorityBadge = task.priority === 'URGENT' || task.priority === 'HIGH'
        ? `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-[#FEE2E2] text-[#B91C1C]">عاجلة</span>`
        : `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-[#FFEDD5] text-[#C2410C]">عادية</span>`;

      let assigneeBadge = task.assignee
        ? `<span class="px-2 py-0.5 text-[10px] font-semibold rounded-full bg-[#F3E8FF] text-[#7E22CE]">👤 ${task.assignee.name}</span>`
        : '';

      let dateFormatted = 'بدون موعد';
      if (task.dueDate) {
        dateFormatted = new Intl.DateTimeFormat('ar-EG', {
          timeZone: 'Asia/Muscat',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        }).format(new Date(task.dueDate));
      }

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex gap-1.5 flex-wrap">
            ${priorityBadge}
            ${assigneeBadge}
          </div>
          <button onclick="deleteTask('${task.id}')" class="text-slate-300 hover:text-red-500 text-xs">✕</button>
        </div>
        <h3 class="font-bold text-xs md:text-sm text-[#1E293B]">${task.title}</h3>
        <div class="pt-2 border-t border-slate-50 flex justify-between items-center text-[11px] text-[#94A3B8]">
          <span>⏰ ${dateFormatted}</span>
          <span class="font-semibold text-indigo-600">${task.progress}%</span>
        </div>
      `;
      return card;
    }

    async function deleteTask(id) {
      if (!confirm('حذف هذه المهمة؟')) return;
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    async function logoutWhatsApp() {
      if (!confirm('إنهاء جلسة واتساب؟')) return;
      await fetch('/api/whatsapp/logout', { method: 'POST' });
      checkWhatsAppStatus();
    }

    checkWhatsAppStatus();
    fetchTasks();
    setInterval(checkWhatsAppStatus, 20000);
    setInterval(fetchTasks, 30000);
  </script>
</body>
</html>
