<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم السكرتير الذكي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- شريط التنقل العلوي -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-xl shadow-md shadow-emerald-100">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">السكرتير التنفيذي الذكي</h1>
          <p class="text-xs text-slate-500">إدارة ومتابعة المهام التلقائية</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>الواتساب متصل ومفعل</span>
        </div>
        <button onclick="disconnectWhatsApp()" class="px-3 py-1.5 text-xs font-semibold text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-xl transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>إنهاء الاتصال</span>
        </button>
      </div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- الإحصائيات -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400">إجمالي المهام</p>
          <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400">قيد التنفيذ</p>
          <h3 id="statInProgress" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-spinner fa-spin-pulse"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400">المهام المكتملة</p>
          <h3 id="statDone" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-check-double"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400">مهام عاجلة</p>
          <h3 id="statUrgent" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
        </div>
        <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg">
          <i class="fa-solid fa-fire"></i>
        </div>
      </div>
    </div>

    <!-- شريط التحكم وزر الإضافة -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <h2 class="text-xl font-extrabold text-slate-900">لوحة تتبع المهام (Kanban)</h2>
        <p class="text-xs text-slate-500 mt-0.5">لوحة مرئية لتوزيع ومتابعة دورة حياة المهام</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="loadTasks()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> تحديث
        </button>
        <button onclick="openAddTaskModal()" class="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl shadow-md transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> مهمة جديدة
        </button>
      </div>
    </div>

    <!-- أعمدة الكانبان -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- الانتظار -->
      <div class="bg-slate-100/70 p-4 rounded-2xl border border-slate-200 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> الانتظار
          </span>
          <span id="countTodo" class="text-xs font-bold bg-white text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">0</span>
        </div>
        <div id="colTodo" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
      </div>

      <!-- جاري التنفيذ -->
      <div class="bg-slate-100/70 p-4 rounded-2xl border border-slate-200 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> جاري التنفيذ
          </span>
          <span id="countInProgress" class="text-xs font-bold bg-white text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">0</span>
        </div>
        <div id="colInProgress" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
      </div>

      <!-- المكتملة -->
      <div class="bg-slate-100/70 p-4 rounded-2xl border border-slate-200 flex flex-col">
        <div class="flex items-center justify-between mb-4">
          <span class="font-bold text-slate-700 flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> مكتملة
          </span>
          <span id="countDone" class="text-xs font-bold bg-white text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">0</span>
        </div>
        <div id="colDone" class="space-y-3 flex-1 overflow-y-auto max-h-[600px]"></div>
      </div>

    </div>
  </main>

  <!-- نافذة إضافة مهمة مع الوقت والشخص المسؤول -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-lg text-slate-900">إضافة مهمة جديدة وإرسال إشعار</h3>
        <button onclick="closeAddTaskModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">عنوان المهمة *</label>
          <input type="text" id="taskTitleInput" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: تسليم عينة The Ribs">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">تفاصيل المهمة</label>
          <textarea id="taskDescInput" rows="2" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="تفاصيل وملاحظات المهمة..."></textarea>
        </div>

        <!-- حقول الشخص المسؤول -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">الشخص المسؤول (المكلف)</label>
            <input type="text" id="taskAssigneeNameInput" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: أحمد">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">رقم واتساب المكلف (اختياري)</label>
            <input type="tel" id="taskAssigneePhoneInput" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="96891234567">
          </div>
        </div>

        <!-- حقول الوقت والأولوية -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">تاريخ ووقت التسليم المحدد *</label>
            <!-- يقبل اليوم والساعة والدقيقة -->
            <input type="datetime-local" id="taskDueDateInput" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">الأولوية</label>
            <select id="taskPriorityInput" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="LOW">منخفضة</option>
              <option value="MEDIUM" selected>متوسطة</option>
              <option value="HIGH">مرتفعة</option>
              <option value="URGENT">عاجل 🚨</option>
            </select>
          </div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" onclick="closeAddTaskModal()" class="px-4 py-2 text-sm font-semibold text-slate-500 hover:bg-slate-100 rounded-xl">إلغاء</button>
          <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow">حفظ وإرسال إشعار</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();

        const colTodo = document.getElementById('colTodo');
        const colInProgress = document.getElementById('colInProgress');
        const colDone = document.getElementById('colDone');

        colTodo.innerHTML = '';
        colInProgress.innerHTML = '';
        colDone.innerHTML = '';

        let todoCount = 0, inProgressCount = 0, doneCount = 0, urgentCount = 0;

        tasks.forEach(task => {
          if (task.priority === 'URGENT') urgentCount++;

          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-sm hover:shadow transition space-y-3";

          const priorityColors = {
            LOW: 'bg-slate-100 text-slate-600',
            MEDIUM: 'bg-blue-50 text-blue-700',
            HIGH: 'bg-amber-50 text-amber-700',
            URGENT: 'bg-rose-50 text-rose-700 border border-rose-200'
          };

          const priorityNames = {
            LOW: 'منخفضة',
            MEDIUM: 'متوسطة',
            HIGH: 'مرتفعة',
            URGENT: 'عاجل 🚨'
          };

          // تنسيق الوقت مع التاريخ
          let formattedDateTime = 'بدون موعد';
          if (task.dueDate) {
            const d = new Date(task.dueDate);
            formattedDateTime = d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
          }

          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <h4 class="font-bold text-sm text-slate-900 leading-snug">${task.title}</h4>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${priorityColors[task.priority] || 'bg-slate-100'} whitespace-nowrap">
                ${priorityNames[task.priority] || task.priority}
              </span>
            </div>

            ${task.description ? `<p class="text-xs text-slate-500 line-clamp-2">${task.description}</p>` : ''}

            <!-- عرض المسؤول إن وجد -->
            ${task.assignee ? `
              <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-50 border border-slate-200/60 text-[11px] text-slate-600">
                <i class="fa-regular fa-user text-slate-400"></i>
                <span class="font-semibold">${task.assignee.name}</span>
              </div>
            ` : ''}

            <div>
              <div class="flex justify-between text-[11px] font-semibold text-slate-400 mb-1">
                <span>نسبة الإنجاز</span>
                <span>${task.progress}%</span>
              </div>
              <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 rounded-full" style="width: ${task.progress}%"></div>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span class="flex items-center gap-1">
                <i class="fa-regular fa-clock text-[10px]"></i>
                ${formattedDateTime}
              </span>
              <div class="flex items-center gap-1">
                <button onclick="updateProgress('${task.id}', ${Math.min(100, task.progress + 25)})" title="رفع نسبة الإنجاز (+25%)" class="p-1 hover:text-emerald-600 text-slate-400"><i class="fa-solid fa-plus-circle text-sm"></i></button>
                <button onclick="deleteTask('${task.id}')" title="حذف المهمة" class="p-1 hover:text-rose-600 text-slate-400"><i class="fa-solid fa-trash-can text-sm"></i></button>
              </div>
            </div>
          `;

          if (task.status === 'DONE' || task.progress >= 100) {
            doneCount++;
            colDone.appendChild(card);
          } else if (task.status === 'IN_PROGRESS' || task.progress > 0) {
            inProgressCount++;
            colInProgress.appendChild(card);
          } else {
            todoCount++;
            colTodo.appendChild(card);
          }
        });

        document.getElementById('statTotal').innerText = tasks.length;
        document.getElementById('statInProgress').innerText = inProgressCount;
        document.getElementById('statDone').innerText = doneCount;
        document.getElementById('statUrgent').innerText = urgentCount;

        document.getElementById('countTodo').innerText = todoCount;
        document.getElementById('countInProgress').innerText = inProgressCount;
        document.getElementById('countDone').innerText = doneCount;

      } catch (err) {
        console.error('خطأ أثناء جلب المهام:', err);
      }
    }

    async function updateProgress(id, newProgress) {
      const status = newProgress >= 100 ? 'DONE' : 'IN_PROGRESS';
      await fetch('/api/tasks/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ progress: newProgress, status })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      if (!confirm('هل تريد حذف هذه المهمة بالتأكيد؟')) return;
      await fetch('/api/tasks/' + id, { method: 'DELETE' });
      loadTasks();
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitleInput').value;
      const description = document.getElementById('taskDescInput').value;
      const priority = document.getElementById('taskPriorityInput').value;
      const dueDate = document.getElementById('taskDueDateInput').value;
      const assigneeName = document.getElementById('taskAssigneeNameInput').value;
      const assigneePhone = document.getElementById('taskAssigneePhoneInput').value;

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, priority, dueDate, assigneeName, assigneePhone })
      });

      closeAddTaskModal();
      document.getElementById('createTaskForm').reset();
      loadTasks();
    }

    async function disconnectWhatsApp() {
      if (!confirm('هل تريد إنهاء جلسة الواتساب الحالية ومسح كود QR جديد؟')) return;
      try {
        await fetch('/api/whatsapp/logout', { method: 'POST' });
        window.location.reload();
      } catch (e) {
        alert('حدث خطأ أثناء إنهاء الاتصال.');
      }
    }

    function openAddTaskModal() {
      document.getElementById('taskModal').classList.remove('hidden');
      document.getElementById('taskModal').classList.add('flex');
    }

    function closeAddTaskModal() {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskModal').classList.remove('flex');
    }

    loadTasks();
    setInterval(loadTasks, 5000);
  </script>
</body>
</html>
