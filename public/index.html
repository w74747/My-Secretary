<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السكرتير التنفيذي الذكي | لوحة المهام</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
    /* تخصيص شريط التمرير الناعم */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="bg-[#F5F6FA] text-[#1E293B] antialiased h-screen overflow-hidden flex">

  <!-- 1. الشريط الجانبي الأيقوني الأساسي (Dark Indigo) -->
  <aside class="w-16 bg-[#4338CA] flex flex-col items-center py-6 gap-6 text-white/70 select-none z-20 shadow-lg">
    <div class="w-10 h-10 bg-white/20 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow-inner">
      س
    </div>
    <nav class="flex flex-col gap-3 mt-4">
      <button title="لوحة المهام" class="p-3 rounded-2xl bg-white/20 text-white transition shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
      </button>
      <button title="جهات الاتصال" class="p-3 rounded-2xl hover:bg-white/10 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
      </button>
      <button onclick="fetchTasks()" title="تحديث البيانات" class="p-3 rounded-2xl hover:bg-white/10 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </nav>
    <div class="mt-auto">
      <button onclick="logoutWhatsApp()" title="إنهاء اتصال واتساب" class="p-3 rounded-2xl hover:bg-red-500/20 hover:text-red-300 transition text-white/50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      </button>
    </div>
  </aside>

  <!-- 2. مساحة العرض الرئيسية -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- رأس الصفحة العلوي (Header) -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 px-8 py-5 flex justify-between items-center z-10">
      <div>
        <h1 class="text-xl font-bold text-[#1E293B]">السكرتير التنفيذي الذكي</h1>
        <p class="text-xs text-[#64748B] mt-0.5" id="completion-summary">جاري تحميل المهام والبيانات...</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- مؤشر اتصال الواتساب الناعم -->
        <div id="wa-status-badge" class="flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 transition">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span>جاري فحص الاتصال...</span>
        </div>

        <!-- زر إضافة مهمة جديدة -->
        <button onclick="openNewTaskModal()" class="bg-[#1E293B] text-white px-4 py-2 rounded-2xl text-xs font-semibold shadow-sm hover:opacity-90 transition flex items-center gap-1.5">
          <span>+ إضافة مهمة جديدة</span>
        </button>
      </div>
    </header>

    <!-- منطقة محتوى الكانبان (Scrollable) -->
    <main class="flex-1 p-8 overflow-x-auto overflow-y-hidden">
      <div class="flex gap-6 h-full items-start">

        <!-- عمود: قيد الانتظار (To Do) -->
        <div class="w-88 min-w-[22rem] max-w-[22rem] flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-4 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
              <h2 class="font-bold text-sm text-[#1E293B]">في الانتظار</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600" id="count-todo">0</span>
            </div>
          </div>
          <div id="col-todo" class="flex-1 overflow-y-auto flex flex-col gap-4 pr-1 pl-1">
            <!-- البطاقات تضاف برمجياً -->
          </div>
        </div>

        <!-- عمود: جاري التنفيذ (In Progress) -->
        <div class="w-88 min-w-[22rem] max-w-[22rem] flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-4 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
              <h2 class="font-bold text-sm text-[#1E293B]">جاري التنفيذ</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-600" id="count-inprogress">0</span>
            </div>
          </div>
          <div id="col-inprogress" class="flex-1 overflow-y-auto flex flex-col gap-4 pr-1 pl-1">
            <!-- البطاقات تضاف برمجياً -->
          </div>
        </div>

        <!-- عمود: مكتملة (Done) -->
        <div class="w-88 min-w-[22rem] max-w-[22rem] flex flex-col max-h-full">
          <div class="flex items-center justify-between mb-4 px-2">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
              <h2 class="font-bold text-sm text-[#1E293B]">المكتملة</h2>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600" id="count-done">0</span>
            </div>
          </div>
          <div id="col-done" class="flex-1 overflow-y-auto flex flex-col gap-4 pr-1 pl-1">
            <!-- البطاقات تضاف برمجياً -->
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- نافذة منبثقة لمسح QR Code عند انقطاع الاتصال -->
  <div id="qr-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white p-7 rounded-3xl shadow-[0_10px_40px_rgba(0,0,0,0.06)] border border-slate-100 max-w-sm w-full mx-4 flex flex-col items-center gap-4 text-center">
      <h3 class="font-bold text-base text-[#1E293B]">ربط خدمة واتساب</h3>
      <p class="text-xs text-[#64748B]">امسح الرمز التالي بكاميرا واتساب بهاتفك لمزامنة السكرتير</p>
      <div id="qr-container" class="w-56 h-56 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-center overflow-hidden">
        <span class="text-xs text-slate-400">جاري تحميل رمز الاستجابة السريعة...</span>
      </div>
      <button onclick="closeQrModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
        إغلاق
      </button>
    </div>
  </div>

  <!-- سكريبت التشغيل وربط البيانات -->
  <script>
    let currentTasks = [];

    async function checkWhatsAppStatus() {
      try {
        const res = await fetch('/api/whatsapp/status');
        const data = await res.json();
        const badge = document.getElementById('wa-status-badge');
        
        if (data.isConnected) {
          badge.className = 'flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#DCFCE7] text-[#15803D] border border-emerald-200 transition';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>واتساب متصل ومفعّل</span>';
        } else {
          badge.className = 'cursor-pointer flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-[#FFEDD5] text-[#C2410C] border border-amber-200 transition hover:bg-amber-100';
          badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span><span>غير متصل (اضغط للمسح)</span>';
          badge.onclick = () => showQrModal(data.qrCode);
        }
      } catch (err) {
        console.error('فشل جلب حالة الواتساب:', err);
      }
    }

    function showQrModal(qrData) {
      const modal = document.getElementById('qr-modal');
      const container = document.getElementById('qr-container');
      modal.classList.remove('hidden');
      if (qrData) {
        container.innerHTML = `<img src="${qrData}" class="w-full h-full object-contain p-2" alt="QR Code" />`;
      }
    }

    function closeQrModal() {
      document.getElementById('qr-modal').classList.add('hidden');
    }

    async function logoutWhatsApp() {
      if (!confirm('هل تريد بالتأكيد إنهاء جلسة الواتساب ومسح الرمز مجدداً؟')) return;
      try {
        await fetch('/api/whatsapp/logout', { method: 'POST' });
        checkWhatsAppStatus();
      } catch (e) {
        console.error(e);
      }
    }

    async function fetchTasks() {
      try {
        const res = await fetch('/api/tasks');
        currentTasks = await res.json();
        renderKanban();
      } catch (e) {
        console.error('فشل جلب المهام:', e);
      }
    }

    function renderKanban() {
      const colTodo = document.getElementById('col-todo');
      const colInProgress = document.getElementById('col-inprogress');
      const colDone = document.getElementById('col-done');

      colTodo.innerHTML = '';
      colInProgress.innerHTML = '';
      colDone.innerHTML = '';

      let countTodo = 0, countProg = 0, countDone = 0;

      currentTasks.forEach(task => {
        const card = createCardElement(task);
        if (task.status === 'DONE' || task.progress === 100) {
          colDone.appendChild(card);
          countDone++;
        } else if (task.status === 'IN_PROGRESS' || task.progress > 0) {
          colInProgress.appendChild(card);
          countProg++;
        } else {
          colTodo.appendChild(card);
          countTodo++;
        }
      });

      document.getElementById('count-todo').textContent = countTodo;
      document.getElementById('count-inprogress').textContent = countProg;
      document.getElementById('count-done').textContent = countDone;

      const total = currentTasks.length;
      const percent = total > 0 ? Math.round((countDone / total) * 100) : 0;
      document.getElementById('completion-summary').textContent = `${percent}% نسبة الإنجاز الكلية (${countDone} من ${total} مهام)`;
    }

    function createCardElement(task) {
      const card = document.createElement('div');
      card.className = "w-full bg-white p-5 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-100 flex flex-col gap-3 transition hover:shadow-md";

      // شارات الأولوية والتكليف الناعمة
      let priorityBadge = '';
      if (task.priority === 'URGENT' || task.priority === 'HIGH') {
        priorityBadge = `<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-[#FEE2E2] text-[#B91C1C]">عاجلة</span>`;
      } else {
        priorityBadge = `<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-[#FFEDD5] text-[#C2410C]">متوسطة</span>`;
      }

      let assigneeBadge = '';
      if (task.assignee) {
        assigneeBadge = `<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-[#F3E8FF] text-[#7E22CE]">👤 ${task.assignee.name}</span>`;
      }

      // تنسيق التاريخ بتوقيت مسقط
      let dateFormatted = 'بدون موعد';
      if (task.dueDate) {
        dateFormatted = new Intl.DateTimeFormat('ar-EG', {
          timeZone: 'Asia/Muscat',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        }).format(new Date(task.dueDate));
      }

      card.innerHTML = `
        <div class="flex gap-2 flex-wrap items-center justify-between">
          <div class="flex gap-1.5 flex-wrap">
            ${priorityBadge}
            ${assigneeBadge}
          </div>
          <button onclick="deleteTask('${task.id}')" title="حذف المهمة" class="text-slate-300 hover:text-red-500 text-xs transition">
            ✕
          </button>
        </div>

        <h3 class="font-bold text-sm text-[#1E293B] leading-snug">${escapeHtml(task.title)}</h3>
        ${task.description ? `<p class="text-xs text-[#64748B] leading-relaxed line-clamp-2">${escapeHtml(task.description)}</p>` : ''}

        <div class="mt-1 pt-2 border-t border-slate-50 flex flex-col gap-2">
          <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
            <div class="bg-[#4338CA] h-full rounded-full transition-all duration-300" style="width: ${task.progress}%"></div>
          </div>
          <div class="flex justify-between items-center text-xs text-[#94A3B8]">
            <span class="flex items-center gap-1">⏰ ${dateFormatted}</span>
            <span class="font-medium">${task.progress}%</span>
          </div>
        </div>
      `;

      return card;
    }

    async function deleteTask(id) {
      if (!confirm('هل تريد بالتأكيد حذف هذه المهمة؟')) return;
      try {
        await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        fetchTasks();
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }

    // التشغيل الدوري الأولي
    checkWhatsAppStatus();
    fetchTasks();
    setInterval(checkWhatsAppStatus, 15000);
    setInterval(fetchTasks, 30000);
  </script>
</body>
</html>
